<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adaptive Emergency Triage Agent — Simulated Decision Support Sandbox. Not a medical device." />
    <meta name="theme-color" content="#030712" />

    <!-- Open Graph -->
    <meta property="og:title" content="TriageAI — Adaptive Emergency Triage Agent" />
    <meta property="og:description" content="Uncertainty-aware autonomous triage decision support for a simulated sandbox." />
    <meta property="og:type" content="website" />

    <!-- Favicon inline SVG as data URI -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛑️</text></svg>" />

    <title>TriageAI — Adaptive Emergency Triage</title>

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Critical CSS — prevent flash of unstyled content */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        background-color: #030712;
        color: #f9fafb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root { min-height: 100vh; }

      /* Loading spinner shown before React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #030712;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-ring {
        width: 48px;
        height: 48px;
        border: 4px solid #1f2937;
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        margin-top: 16px;
        font-size: 13px;
        color: #6b7280;
        letter-spacing: 0.05em;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #111827; }
      ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
  </head>

  <body>
    <!-- Initial loader — hidden by main.jsx after React mounts -->
    <div id="initial-loader">
      <div class="loader-ring"></div>
      <p class="loader-text">Loading TriageAI…</p>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Disclaimer for non-JS users -->
    <noscript>
      <div style="background:#030712;color:#f9fafb;text-align:center;padding:2rem;font-family:sans-serif;">
        <h2>⛑️ TriageAI — Adaptive Emergency Triage Agent</h2>
        <p style="margin-top:1rem;color:#9ca3af;">
          JavaScript is required to run this application.
          Please enable JavaScript in your browser settings.
        </p>
        <p style="margin-top:1rem;color:#ef4444;font-size:0.85rem;">
          ⚕️ This is a simulated sandbox only — not a medical device.
          In a real emergency, call 108 or 112.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
